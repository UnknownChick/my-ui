<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./assets/scss/style.scss">

    <title>Sidev UI</title>
  </head>
  <body class="p-5">
    <div class="card">
      <div class="card__title">
        <h1>Sidev UI</h1>
      </div>
      <div class="card__body">
        <article>
          <h2 class="mb-1">Breadcrumbs</h2>
          <div class="row">
            <div class="col">
              <nav class="breadcrumb">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
              </nav>
            </div>
          </div>
        </article>
        <hr class="my-2">
        <article>
          <h2 class="mb-1">Buttons</h2>
          <div class="row mb-1">
            <div class="col">
              <a href="#" class="btn btn--primary btn--sm">Primary</a>
            </div>
            <div class="col">
              <a href="#" class="btn btn--secondary btn--xl">Secondary</a>
            </div>
          </div>
          <div class="row mb-1">
            <div class="col">
              <a href="#" class="btn btn--primary">Primary</a>
            </div>
            <div class="col">
              <a href="#" class="btn btn--secondary">Secondary</a>
            </div>
          </div>
          <div class="row mb-1">
            <div class="col">
              <a href="#" class="btn btn--primary-outline">Primary</a>
            </div>
            <div class="col">
              <a href="#" class="btn btn--secondary-outline">Secondary</a>
            </div>
          </div>
        </article>
        <hr class="my-2">
        <article>
          <h2 class="mb-1">Loader</h2>
          <div class="row mb-1">
            <div class="col">
              <div class="loader"></div>
            </div>
          </div>
        </article>
        <hr class="my-2">
        <article>
          <h2 class="mb-1">Badges</h2>
          <div class="row mb-1">
            <div class="col">
              <h3 class="mb-1">Soft Badges</h3>
              <div class="d-flex gap-1">
                <span class="badge badge--soft-red">Red</span>
                <span class="badge badge--soft-orange">Orange</span>
                <span class="badge badge--soft-blue">Blue</span>
                <span class="badge badge--soft-green">Green</span>
                <span class="badge badge--soft-purple">Purple</span>
                <span class="badge badge--soft-grey">Grey</span>
                <span class="badge badge--soft-brown">Brown</span>
                <span class="badge badge--soft-cyan">Cyan</span>
                <span class="badge badge--soft-black">Black</span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <h3 class="mb-1">High Badges</h3>
               <div class="d-flex gap-1">
                <span class="badge badge--high-red">Red</span>
                <span class="badge badge--high-orange">Orange</span>
                <span class="badge badge--high-blue">Blue</span>
                <span class="badge badge--high-green">Green</span>
                <span class="badge badge--high-purple">Purple</span>
                <span class="badge badge--high-grey">Grey</span>
                <span class="badge badge--high-brown">Brown</span>
                <span class="badge badge--high-cyan">Cyan</span>
                <span class="badge badge--high-black">Black</span>
                </div>
            </div>
          </div>
        </article>
      </div>
    </div>
    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
